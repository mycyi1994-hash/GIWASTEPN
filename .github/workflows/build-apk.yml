name: Build APK

on:
  push:
    branches: ["claude/work-history-pjm57c"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrideUp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # 컨테이너/사용자가 git으로 바로 받아갈 수 있도록 APK를 배포 전용 브랜치에 커밋한다.
      - name: Publish APK to apk-dist branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/dist
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/dist/StrideUp-debug.apk
          cd /tmp/dist
          {
            echo "# StrideUp APK 배포 브랜치"
            echo
            echo "CI가 빌드한 디버그 APK가 커밋됩니다."
            echo
            echo "- 원본 커밋: ${GITHUB_SHA}"
            echo "- 빌드 시각(UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
          } > README.md
          git init -b apk-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "StrideUp debug APK (${GITHUB_SHA:0:7})"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-dist
