name: Build APK

on:
  push:
    branches: ["claude/work-history-pjm57c"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # 고정 키스토어로 서명됐는지 확인한다. 지문이 빌드마다 달라지면
      # 기기에 이미 설치된 앱을 덮어쓸 수 없다(INSTALL_FAILED_UPDATE_INCOMPATIBLE).
      - name: Verify APK signature is stable
        run: |
          set -euo pipefail
          EXPECTED=$(keytool -list -v -keystore app/debug.keystore -storepass android \
            | grep 'SHA256:' | head -1 | tr -d ' ')
          ACTUAL=$(keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk \
            | grep 'SHA256:' | head -1 | tr -d ' ')
          echo "keystore : $EXPECTED"
          echo "apk      : $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::APK가 고정 debug 키스토어로 서명되지 않았습니다."
            exit 1
          fi
          echo "✓ 서명 일치 — 이전 빌드 위에 업데이트 설치 가능"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StepUp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # 컨테이너/사용자가 git으로 바로 받아갈 수 있도록 APK를 배포 전용 브랜치에 커밋한다.
      - name: Publish APK to apk-dist branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/dist
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/dist/StepUp-debug.apk
          # 예전 링크(StrideUp-debug.apk)를 공유한 곳이 있어 같은 파일을 옛 이름으로도 남긴다
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/dist/StrideUp-debug.apk
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' "${GITHUB_WORKSPACE}/app/build.gradle.kts" | head -1 || true)
          VERSION=${VERSION:-unknown}
          cd /tmp/dist
          {
            echo "# StepUp APK 배포 브랜치"
            echo
            echo "CI가 빌드한 디버그 APK가 커밋됩니다. 최신 빌드 직접 링크:"
            echo
            echo '```'
            echo "https://github.com/${GITHUB_REPOSITORY}/raw/apk-dist/StepUp-debug.apk"
            echo '```'
            echo
            echo "- 버전: ${VERSION}"
            echo "- 원본 커밋: ${GITHUB_SHA}"
            echo "- 빌드 시각(UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo
            echo "\`StrideUp-debug.apk\`는 예전 이름으로 남겨둔 동일한 파일입니다."
          } > README.md
          git init -b apk-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "StepUp debug APK ${VERSION} (${GITHUB_SHA:0:7})"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-dist
